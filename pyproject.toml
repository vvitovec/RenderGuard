[project]
name = "renderguard"
version = "1.0.0"
description = "Evidence-bound release controls for AI-prepared supplier payments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "PyYAML>=6,<7",
  "pypdf>=5,<7", "pypdfium2>=4.30,<6", "Pillow>=11,<13",
  "pytesseract>=0.3.13,<1", "zxing-cpp>=2.3,<4", "reportlab>=4.3,<5",
  "qrcode>=8,<9"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
