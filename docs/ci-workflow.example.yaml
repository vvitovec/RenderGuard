name: Verify RenderGuard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  control-and-evidence-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install bounded test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python3 -m pip install uv==0.10.0
          uv sync --extra dev --frozen
          npm ci
      - name: Compile frontend and self-hosted API reference
        run: npm run build
      - name: Check code and execute positive / negative controls
        run: |
          uv run ruff check renderguard tests scripts
          uv run python -m pytest -q --junitxml=evals/ci-unit-tests.xml
          uv run python -m scripts.evaluate --output evals/ci-evidence.json
      - name: Save actual CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderguard-verification
          path: |
            evals/ci-unit-tests.xml
            evals/ci-evidence.json
