name: renderguard-local
services:
  gateway:
    build: .
    image: renderguard:local
    command: [uvicorn, renderguard.api:app, --host, 0.0.0.0, --port, '18341']
    ports: ['127.0.0.1:18341:18341']
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      AUTH_MODE: demo
      COOKIE_SECURE: 'false'
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: ['./data/state:/data/state','./data/documents:/data/documents','./evals:/app/evals:ro']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
  pdf-worker:
    image: renderguard:local
    command: [python, -m, renderguard.worker]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 64
    environment: {DOCUMENT_ROOT: /data/documents, OMP_THREAD_LIMIT: '2'}
    volumes: ['./data/documents:/data/documents']
    tmpfs: ['/tmp:size=128m,mode=1777']
    depends_on: [gateway]
